[package]
name = "moremath"
version.workspace = true
edition = "2024"
description = "Numbers beyond the standard library: bf16, f16, tf32, u1/u4/i4 -- bit patterns, IEEE rounding and conversions (no_std)"
license = "MIT"
repository = "https://github.com/Jabberwocky238/moremath"
categories = ["mathematics", "no-std"]
keywords = ["bf16", "f16", "tf32", "float", "bitfield"]

[dependencies]
moremath-macros = { path = "macros", version = "=0.2.2" }

[features]
# `Execute` / `Executor` (`parallel.rs`): a batch of tasks in, their outputs in a `Vec`;
# `ThreadSingle` (`thread_single.rs`): every task on the calling thread. Still `no_std`.
alloc = []
# `ThreadMulti` (`thread_multi.rs`): the same traits, lock-free, over a pool of OS threads.
std = ["alloc"]

[lints]
workspace = true

[workspace]
members = ["macros"]

[workspace.package]
version = "0.2.2"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
doc_markdown = "allow"
must_use_candidate = "allow"
missing_panics_doc = "allow"
